name: Build Open Bibles candidate packs

on:
  pull_request:
    paths:
      - "scripts/build-openbibles-pack.mjs"
      - "scripts/openbibles-pack-sources.mjs"
      - ".github/workflows/build-openbibles-packs.yml"
  workflow_dispatch:
    inputs:
      locale:
        description: "Candidate locale to build, or all"
        required: true
        default: "ru"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACK_LOCALE: ${{ github.event_name == 'workflow_dispatch' && inputs.locale || 'ru' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-openbibles-pack.mjs "$PACK_LOCALE"
      - run: find dist/bible-packs -maxdepth 1 -type f -name '*.sha256' -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-openbibles-pack-${{ env.PACK_LOCALE }}
          path: dist/bible-packs/
          if-no-files-found: error
          retention-days: 14
