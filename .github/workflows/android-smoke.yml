name: Android PR smoke

# Unsigned (debug-keystore) release build + emulator visual smoke for pull
# requests. Uses no secrets and publishes nothing; the signed Play build and
# content publishing stay in android-apk.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # x86_64 for the emulator, arm64-v8a so the same APK installs on phones.
      - name: Limit Android architectures
        run: sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties

      - name: Build release APK (debug keystore)
        run: cd android && ./gradlew assembleRelease --no-daemon

      # Debug-keystore signed test build: uninstall any Play build before installing.
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: selaora-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.lumen.dailyprayer -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            ! grep -q "FATAL EXCEPTION" logcat.txt
            adb shell pidof com.lumen.dailyprayer
            bash scripts/capture-android-visual-smoke.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-logcat
          path: |
            logcat.txt
            visual-smoke/*.logcat.txt
          if-no-files-found: ignore

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: ignore
