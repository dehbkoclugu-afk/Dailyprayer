name: Release application content

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: application-content-v1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application content
        run: npm run application-content:build
      - name: Verify production UI locales
        run: npm run ui-locales:verify:production
      - name: Verify production application content
        run: npm run application-content:verify:production
      - name: Verify complete release asset coverage
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { APPLICATION_LOCALES } from './src/i18n/applicationLocales.ts';
          const directory = 'content/application';
          const manifest = JSON.parse(fs.readFileSync(`${directory}/manifest.json`, 'utf8'));
          const advertised = APPLICATION_LOCALES.map(({ tag }) => tag).sort();
          const manifestLocales = manifest.releases.map(({ locale }) => locale).sort();
          if (JSON.stringify(manifestLocales) !== JSON.stringify(advertised)) {
            throw new Error('Refusing release: manifest does not exactly match advertised locales');
          }
          const expected = advertised.map((locale) => `${locale}.json`);
          const actual = fs.readdirSync(directory)
            .filter((name) => name.endsWith('.json') && !name.startsWith('manifest.'))
            .sort();
          for (const extra of actual.filter((name) => !expected.includes(name))) {
            fs.unlinkSync(`${directory}/${extra}`);
          }
          const releaseAssets = fs.readdirSync(directory)
            .filter((name) => name.endsWith('.json') && !name.startsWith('manifest.'))
            .sort();
          if (JSON.stringify(releaseAssets) !== JSON.stringify(expected)) {
            throw new Error('Refusing release: locale assets do not exactly match manifest coverage');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-application-content-v1
          path: |
            content/application/manifest.json
            content/application/*.json
            !content/application/manifest.development.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish immutable application content release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: application-content-v1
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to mutate immutable application content assets."
            exit 1
          fi
          mapfile -t packs < <(
            find content/application -maxdepth 1 -type f -name '*.json' ! -name 'manifest.*' -print | sort
          )
          test "${#packs[@]}" -eq 38
          gh release create "$TAG" content/application/manifest.json "${packs[@]}" \
            --title "Lumen application content $TAG" \
            --notes "Validated application content for all 38 advertised production locales; cek, hlt, and kos remain native-review gated."
