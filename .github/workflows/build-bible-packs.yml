name: Build Bible language packs

on:
  workflow_dispatch:
    inputs:
      locale:
        description: "Locale tag to build (for example ar, ja, zh-Hans), or all"
        required: true
        default: "en"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build source-pinned Bible pack
        env:
          SOURCE_DATE_EPOCH: "1786147200"
        run: node scripts/build-ebible-pack.mjs "${{ inputs.locale }}"

      - name: List pack checksums
        run: find dist/bible-packs -name '*.sha256' -type f -maxdepth 1 -print -exec cat {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-bible-pack-${{ inputs.locale }}
          path: dist/bible-packs/
          if-no-files-found: error
          retention-days: 14
