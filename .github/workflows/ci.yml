name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Scripture data is immutable source data. This fails if a bundled edition
      # no longer matches the manifest in docs/scripture-sources.md, which is the
      # only place a deliberate change is accepted. Offline and deterministic.
      - name: Scripture integrity
        run: npm run scripture-check
      # Everything the app claims about licences, prices, trials, notifications
      # and privacy has to match what the code does. Nothing else re-reads a
      # policy against the implementation.
      - name: Copy accuracy
        run: npm run release-claims
