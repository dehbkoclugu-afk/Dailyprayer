name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Verify immutable Scripture and release rights
        run: |
          npm run scripture:verify:integrity
          npm run scripture:verify:rights
      - name: Verify completed UI locale modules
        run: npm run ui-locales:verify
      - name: Verify completed application content packs
        run: npm run application-content:verify
