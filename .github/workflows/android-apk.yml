name: Android Play release

on:
  workflow_dispatch:
  push:
    branches:
      - claude/bible-app-monetization-design-n3uiqr
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: plus
      EXPO_PUBLIC_SUPPORT_EMAIL: dehbkoclugu@gmail.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }
          test -n "$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY" || { echo "EXPO_PUBLIC_REVENUECAT_ANDROID_KEY is missing"; exit 1; }
          [[ "$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY" == goog_* ]] || { echo "RevenueCat Android key must start with goog_"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Install dependencies
        run: npm ci

      - name: Verify production localization coverage
        run: |
          npm run application-content:build
          npm run ui-locales:verify:production
          npm run application-content:verify:production
          npm run scripture:verify:integrity
          npm run scripture:verify:rights

      # Publish application-content-v1 first. The binary must never advertise a
      # downloadable locale whose immutable manifest/assets are not live yet.
      - name: Smoke test published application content
        if: github.event_name != 'pull_request'
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { APPLICATION_LOCALES } from './src/i18n/applicationLocales.ts';
          import {
            LATEST_APPLICATION_CONTENT_MANIFEST_URL,
            validateApplicationContentManifest,
          } from './src/services/applicationContentRegistry.ts';

          const response = await fetch(LATEST_APPLICATION_CONTENT_MANIFEST_URL);
          if (!response.ok) throw new Error(`Published manifest HTTP ${response.status}`);
          const manifest = validateApplicationContentManifest(await response.json());
          const advertised = APPLICATION_LOCALES.map(({ tag }) => tag).sort();
          const published = manifest.releases.map(({ locale }) => locale).sort();
          if (JSON.stringify(published) !== JSON.stringify(advertised)) {
            throw new Error('Published manifest does not exactly match advertised locales');
          }
          await Promise.all(manifest.releases.map(async (release) => {
            const assetResponse = await fetch(release.downloadUrl);
            if (!assetResponse.ok) throw new Error(`${release.locale} asset HTTP ${assetResponse.status}`);
            const bytes = Buffer.from(await assetResponse.arrayBuffer());
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== release.bytes || digest !== release.sha256) {
              throw new Error(`${release.locale} published asset integrity mismatch`);
            }
          }));
          NODE

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore upload keystore
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Configure release signing and version code
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          def block_end(source: str, marker: str, start: int = 0) -> int:
              marker_pos = source.index(marker, start)
              opening = source.index("{", marker_pos)
              depth = 0
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return index
              raise RuntimeError(f"Unclosed Gradle block: {marker}")

          signing_end = block_end(text, "signingConfigs")
          release_signing = '''
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
          '''
          text = text[:signing_end] + release_signing + text[signing_end:]

          build_types_start = text.index("buildTypes")
          release_start = text.index("release", build_types_start)
          release_end = block_end(text, "release", build_types_start)
          release_block = text[release_start:release_end]
          if "signingConfig signingConfigs.debug" not in release_block:
              raise RuntimeError("Expected Expo debug signing line was not found in release block")
          release_block = release_block.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release",
              1,
          )
          text = text[:release_start] + release_block + text[release_end:]

          text, count = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              lambda match: f"{match.group(1)}versionCode {os.environ['GITHUB_RUN_NUMBER']}",
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Could not set Android versionCode")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Limit Android architectures
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: Build signed release AAB and APK
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify release signatures
        shell: bash
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: lumen-play-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks

  smoke:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout visual smoke runner
        uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: lumen-signed-release-apk

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app-release.apk
            adb logcat -c
            adb shell monkey -p com.lumen.dailyprayer -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            ! grep -q "FATAL EXCEPTION" logcat.txt
            adb shell pidof com.lumen.dailyprayer
            bash scripts/capture-android-visual-smoke.sh

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-prayer-logcat
          path: logcat.txt
          if-no-files-found: ignore

      - name: Upload visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-visual-smoke
          path: visual-smoke/*.png
          if-no-files-found: error
