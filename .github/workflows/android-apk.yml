# Meditasyon reposundaki APK iş akışından uyarlanmıştır.
# Çıktı, Actions çalışmasında "daily-prayer-apk" artifact'i olarak yayınlanır.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.apk-trigger'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Disk temizliği
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Bağımlılıklar
        run: npm ci

      # Yayın kapısı: APK bir sürüm artifact'ı olduğu için, doğrulanmamış haklara
      # sahip bir sürüm, değiştirilmiş Kutsal Kitap metni ya da koda uymayan bir
      # beyan derlemeye girmemeli. release-check üçünü birden çalıştırır.
      - name: Yayın kontrolü
        run: npm run release-check

      - name: Android bundle bütçesi
        run: |
          npx expo export --platform android --output-dir dist-android
          npm run release-artifact-check -- dist-android

      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install

      - name: Mimarileri daralt
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: daily-prayer-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: APK'yı indir
        uses: actions/download-artifact@v4
        with:
          name: daily-prayer-apk

      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app-release.apk
            adb logcat -c
            adb shell monkey -p com.lumen.dailyprayer -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            ! grep -q "FATAL EXCEPTION" logcat.txt
            adb shell pidof com.lumen.dailyprayer

      - name: Logcat'i yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-prayer-logcat
          path: logcat.txt
          if-no-files-found: ignore
