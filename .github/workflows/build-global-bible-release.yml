name: Build global Bible release bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable Bible pack release tag/version'
        required: true
        default: 'bible-packs-v1'
      base_url:
        description: 'HTTPS base URL that will host manifest pack files'
        required: true
        default: 'https://github.com/dehbkoclugu-afk/Dailyprayer/releases/download/bible-packs-v1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SWORD export tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsword-utils unzip
      - name: Build 40 structurally validated Scripture packs
        env:
          BIBLE_PACK_TMPDIR: ${{ runner.temp }}
          BIBLE_PACK_RELEASE_VERSION: ${{ inputs.version }}
          BIBLE_PACK_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/build-global-bible-release.mjs
      - name: Verify bundle size and manifest
        run: |
          test "$(find dist/bible-packs -maxdepth 1 -name '*.json' ! -name manifest.json | wc -l)" -eq 40
          node -e "const m=require('./dist/bible-packs/manifest.json'); if(m.releases.length!==40) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-global-bible-release-${{ inputs.version }}
          path: dist/bible-packs/
          if-no-files-found: error
          retention-days: 14
