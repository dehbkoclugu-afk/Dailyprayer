<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Selaora legal and support pages" />
    <title>Selaora | Legal &amp; Support</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #f2eee6; background: radial-gradient(circle at 30% 10%, #292247 0, #0e1220 48%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; }
      main { max-width: 820px; margin: 0 auto; padding: 80px 24px; }
      .mark { color: #d9a441; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 14px 0 12px; max-width: 680px; font-family: Georgia, serif; font-size: clamp(44px, 8vw, 72px); line-height: 1; }
      .intro { max-width: 600px; color: #c9c4ba; font-size: 18px; line-height: 1.65; }
      .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-top: 48px; }
      a { display: block; padding: 24px; border: 1px solid rgba(217,164,65,.38); border-radius: 18px; background: rgba(217,164,65,.07); color: #f2eee6; text-decoration: none; }
      a:hover { border-color: #d9a441; background: rgba(217,164,65,.12); }
      strong { display: block; color: #f5d88f; font-family: Georgia, serif; font-size: 24px; margin-bottom: 8px; }
      span { color: #c9c4ba; line-height: 1.5; }
      footer { margin-top: 56px; color: #8f8c86; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Selaora by CEY Studio</div>
      <h1>Daily prayer, with clarity and care.</h1>
      <p class="intro">Legal information and privacy controls for Selaora: Daily Prayer &amp; Bible.</p>
      <div class="links">
        <a href="privacy/"><strong>Privacy Policy</strong><span>How Selaora stores and processes information.</span></a>
        <a href="delete-account/"><strong>Data Deletion</strong><span>Delete local app data or submit a deletion request.</span></a>
      </div>
      <footer>© 2026 CEY Studio</footer>
    </main>
  </body>
</html>
